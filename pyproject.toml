[project]
name = "credit-scoring-platform"
version = "0.1.0"
description = "Plateforme de scoring credit avec pipeline MLOps complet"
authors = [
    {name = "Soufiane Harzane"}
]
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "xgboost (>=3.3.0,<4.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "shap (>=0.52.0,<0.53.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "prefect (>=3.8.6,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "evidently (>=0.7.23,<0.8.0)",
    "streamlit (>=1.64.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
