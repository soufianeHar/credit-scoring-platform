[project]
name = "credit-scoring-platform"
version = "0.1.0"
description = "Plateforme de scoring credit avec pipeline MLOps complet"
authors = [
    {name = "Soufiane Harzane"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
